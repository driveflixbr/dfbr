<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Streamverse — Arquivo</title>
<meta name="description" content="Um arquivo de streaming leve, apenas em texto. Navegue por plataformas, filmes e séries." />
<style>
  :root {
    --bg: #0b0b0b;
    --bg-elev: #141414;
    --bg-elev-2: #1f1f1f;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text-dim: #a3a3a3;
    --text-mute: #6b6b6b;
    --accent: #e50914;
    --accent-hover: #f6121d;
    --radius: 10px;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
    --transition: 200ms cubic-bezier(.2,.7,.2,1);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body.modal-open { overflow: hidden; }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11,11,11,.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: .5px;
    color: var(--accent);
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
  }
  .logo span { color: var(--text); }

  .breadcrumb {
    flex: 1;
    color: var(--text-dim);
    font-size: 14px;
    min-width: 120px;
  }
  .breadcrumb .crumb {
    cursor: pointer;
    transition: color var(--transition);
  }
  .breadcrumb .crumb:hover { color: var(--text); }
  .breadcrumb .sep { margin: 0 8px; color: var(--text-mute); }
  .breadcrumb .current { color: var(--text); font-weight: 600; }

  .search-wrap {
    position: relative;
    flex: 0 1 280px;
  }
  .search-wrap.hidden { display: none; }
  .search-input {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px 10px 38px;
    border-radius: var(--radius);
    font-size: 14px;
    outline: none;
    transition: border-color var(--transition), background var(--transition);
  }
  .search-input::placeholder { color: var(--text-mute); }
  .search-input:focus {
    border-color: var(--accent);
    background: var(--bg-elev-2);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-mute);
    pointer-events: none;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .page-title {
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 8px;
    font-weight: 800;
    letter-spacing: -.5px;
  }
  .page-subtitle {
    color: var(--text-dim);
    margin: 0 0 32px;
    font-size: 15px;
  }

  /* Platform list */
  .platform-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 560px;
    margin: 0 auto;
  }
  .platform-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all var(--transition);
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: inherit;
  }
  .platform-card:hover {
    background: var(--bg-elev-2);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .platform-card .name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  .platform-card .meta {
    color: var(--text-mute);
    font-size: 13px;
  }
  .platform-card .arrow {
    color: var(--text-mute);
    transition: transform var(--transition), color var(--transition);
  }
  .platform-card:hover .arrow {
    color: var(--accent);
    transform: translateX(4px);
  }

  /* Type selector */
  .type-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 560px;
    margin: 0 auto;
  }
  .type-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 24px;
    cursor: pointer;
    text-align: center;
    transition: all var(--transition);
    color: var(--text);
    font-family: inherit;
  }
  .type-card:hover {
    background: var(--bg-elev-2);
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }
  .type-card .label {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .type-card .count {
    color: var(--text-mute);
    font-size: 13px;
  }

  /* Title list */
  .letter-group { margin-bottom: 32px; }
  .letter-heading {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .titles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 6px;
  }
  .title-item {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
    color: var(--text);
    font-size: 15px;
    text-align: left;
    transition: all 150ms ease;
    font-family: inherit;
  }
  .title-item:hover {
    background: var(--bg-elev);
    border-color: var(--border);
    color: var(--accent);
    padding-left: 18px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-mute);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  /* Back button */
  .back-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 24px;
    transition: all var(--transition);
    font-family: inherit;
  }
  .back-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  /* Modal */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 200ms ease;
  }
  .modal.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-content {
    width: 100%;
    max-width: 1100px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: slideUp 250ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .modal-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .modal-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    font-family: inherit;
  }
  .icon-btn:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .icon-btn.copied {
    background: #16a34a;
    border-color: #16a34a;
    color: white;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .video-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Animations */
  .view {
    animation: viewIn 250ms ease;
  }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 640px) {
    .header-inner { padding: 14px 16px; gap: 12px; }
    .breadcrumb { order: 3; flex-basis: 100%; }
    .search-wrap { flex: 1; }
    main { padding: 24px 16px 60px; }
    .type-list { grid-template-columns: 1fr; }
    .platform-card { padding: 18px 20px; }
    .titles { grid-template-columns: 1fr; }
    .modal { padding: 0; }
    .modal-content { border-radius: 0; height: 100%; display: flex; flex-direction: column; }
    .video-wrap { flex: 1; aspect-ratio: auto; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg-elev-2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* Source selection modal */
  .source-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 150;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 180ms ease;
  }
  .source-modal.open { display: flex; }
  .source-card {
    width: 100%;
    max-width: 380px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 24px 22px;
    box-shadow: var(--shadow);
    animation: sourcePop 220ms cubic-bezier(.2,.7,.2,1);
    text-align: center;
  }
  @keyframes sourcePop {
    from { transform: translateY(12px) scale(.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  .source-eyebrow {
    color: var(--text-mute);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 0 0 6px;
  }
  .source-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 18px;
    color: var(--text);
    word-break: break-word;
  }
  .source-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .source-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elev-2);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
  }
  .source-btn:hover {
    border-color: var(--accent);
    background: #262626;
    transform: translateY(-1px);
  }
  .source-btn svg { flex-shrink: 0; }
  .source-btn.drive:hover { color: #4285f4; }
  .source-btn.telegram:hover { color: #29b6f6; }
  .source-cancel {
    margin-top: 14px;
    background: transparent;
    border: none;
    color: var(--text-mute);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: color var(--transition);
  }
  .source-cancel:hover { color: var(--text); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 14px;
    z-index: 200;
    transition: transform 250ms cubic-bezier(.2,.7,.2,1);
    box-shadow: var(--shadow);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" id="logo">Stream<span>verse</span></div>
      <nav class="breadcrumb" id="breadcrumb" aria-label="Navegação"></nav>
      <div class="search-wrap hidden" id="searchWrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </span>
        <input id="search" class="search-input" type="text" placeholder="Buscar títulos..." aria-label="Buscar títulos" />
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Título</h3>
        <div class="modal-actions">
          <button class="icon-btn" id="copyBtn" title="Copiar link" aria-label="Copiar link do vídeo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          </button>
          <button class="icon-btn" id="closeBtn" title="Fechar" aria-label="Fechar player">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
      </div>
      <div class="video-wrap">
        <iframe id="player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <div class="source-modal" id="sourceModal" role="dialog" aria-modal="true" aria-labelledby="sourceTitle">
    <div class="source-card">
      <p class="source-eyebrow">Escolha a fonte</p>
      <h3 class="source-title" id="sourceTitle">Título</h3>
      <div class="source-buttons">
        <button class="source-btn drive" id="sourceDrive">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"/><path d="m4.93 10.93 4.24 4.24"/><path d="M2 18h6"/><path d="M16 18h6"/><path d="m14.83 15.17 4.24-4.24"/><path d="M8 22h8"/><circle cx="12" cy="14" r="2"/></svg>
          Google Drive
        </button>
        <button class="source-btn telegram" id="sourceTelegram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>
          Telegram
        </button>
      </div>
      <button class="source-cancel" id="sourceCancel">Cancelar</button>
    </div>
  </div>

  <div class="toast" id="toast">Link copiado</div>

<script>
/* =========================================================
   DATA — IMPORTANTE: Para ter escolha de links, use "links"
   Para link direto (sem escolha), use apenas "link"
   ========================================================= */
const DATA = {
  netflix: {
    name: "Netflix",
    movies: [
      { title: "Avatar", links: { drive: "https://drive.google.com/LINK_AVATAR", telegram: "https://t.me/LINK_AVATAR" } },
      { title: "Vingadores", links: { drive: "https://drive.google.com/LINK_VINGADORES", telegram: "https://t.me/LINK_VINGADORES" } },
      { title: "Batman", link: "https://drive.google.com/LINK_DIRETO_BATMAN" },
      { title: "Blade Runner 2049", link: "https://example.com/blade" }
    ],
    series: [
      { title: "Stranger Things", links: { drive: "https://drive.google.com/ST", telegram: "https://t.me/ST" } },
      { title: "Black Mirror", links: { drive: "https://drive.google.com/BM", telegram: "https://t.me/BM" } },
      { title: "Breaking Bad", link: "https://example.com/bb" }
    ]
  },
  globoplay: {
    name: "Globoplay",
    movies: [
      { title: "Cidade de Deus", links: { drive: "https://drive.google.com/CDD", telegram: "https://t.me/CDD" } }
    ],
    series: [
      { title: "Sob Pressão", link: "https://example.com/sp" }
    ]
  }
};

/* =========================================================
   ESTADO
   ========================================================= */
const state = {
  view: "platforms",
  platform: null,
  type: null,
  search: ""
};

const app = document.getElementById("app");
const breadcrumb = document.getElementById("breadcrumb");
const searchWrap = document.getElementById("searchWrap");
const searchInput = document.getElementById("search");
const modal = document.getElementById("modal");
const player = document.getElementById("player");
const modalTitle = document.getElementById("modalTitle");
const closeBtn = document.getElementById("closeBtn");
const copyBtn = document.getElementById("copyBtn");
const logo = document.getElementById("logo");
const toast = document.getElementById("toast");

let currentLink = "";

/* =========================================================
   RENDERIZAÇÃO
   ========================================================= */
function render() {
  app.innerHTML = "";
  renderBreadcrumb();
  toggleSearch();

  if (state.view === "platforms") return renderPlatforms();
  if (state.view === "types") return renderTypes();
  if (state.view === "titles") return renderTitles();
}

function renderBreadcrumb() {
  const parts = [];
  parts.push(`<span class="crumb" data-nav="platforms">Início</span>`);
  if (state.platform) {
    parts.push(`<span class="sep">/</span>`);
    const isLeaf = state.view === "types";
    parts.push(isLeaf
      ? `<span class="current">${DATA[state.platform].name}</span>`
      : `<span class="crumb" data-nav="types">${DATA[state.platform].name}</span>`);
  }
  if (state.type) {
    parts.push(`<span class="sep">/</span>`);
    parts.push(`<span class="current">${state.type === "movies" ? "Filmes" : "Séries"}</span>`);
  }
  breadcrumb.innerHTML = parts.join("");
  breadcrumb.querySelectorAll(".crumb").forEach(el => {
    el.addEventListener("click", () => {
      const nav = el.dataset.nav;
      if (nav === "platforms") goHome();
      else if (nav === "types") goTypes(state.platform);
    });
  });
}

function toggleSearch() {
  if (state.view === "titles") {
    searchWrap.classList.remove("hidden");
  } else {
    searchWrap.classList.add("hidden");
    searchInput.value = "";
    state.search = "";
  }
}

function renderPlatforms() {
  const view = document.createElement("div");
  view.className = "view";
  view.innerHTML = `
    <h1 class="page-title">Escolha uma plataforma</h1>
    <p class="page-subtitle">Navegue no arquivo por serviço de streaming.</p>
    <div class="platform-list" id="platformList"></div>
  `;
  app.appendChild(view);

  const list = view.querySelector("#platformList");
  Object.entries(DATA).forEach(([key, plat]) => {
    const btn = document.createElement("button");
    btn.className = "platform-card";
    btn.innerHTML = `
      <div>
        <div class="name">${plat.name}</div>
        <div class="meta">${plat.movies.length} filmes · ${plat.series.length} séries</div>
      </div>
      <span class="arrow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </span>
    `;
    btn.addEventListener("click", () => goTypes(key));
    list.appendChild(btn);
  });
}

function renderTypes() {
  const plat = DATA[state.platform];
  const view = document.createElement("div");
  view.className = "view";
  view.innerHTML = `
    <button class="back-btn" id="backBtn">← Voltar</button>
    <h1 class="page-title">${plat.name}</h1>
    <p class="page-subtitle">O que você gostaria de assistir?</p>
    <div class="type-list">
      <button class="type-card" data-type="movies">
        <div class="label">Filmes</div>
        <div class="count">${plat.movies.length} títulos</div>
      </button>
      <button class="type-card" data-type="series">
        <div class="label">Séries</div>
        <div class="count">${plat.series.length} títulos</div>
      </button>
    </div>
  `;
  app.appendChild(view);

  view.querySelector("#backBtn").addEventListener("click", goHome);
  view.querySelectorAll(".type-card").forEach(card => {
    card.addEventListener("click", () => goTitles(state.platform, card.dataset.type));
  });
}

function renderTitles() {
  const plat = DATA[state.platform];
  const items = plat[state.type] || [];
  const view = document.createElement("div");
  view.className = "view";
  view.innerHTML = `
    <button class="back-btn" id="backBtn">← Voltar</button>
    <h1 class="page-title">${plat.name} — ${state.type === "movies" ? "Filmes" : "Séries"}</h1>
    <p class="page-subtitle">${items.length} título(s) disponível(is).</p>
    <div id="titleArea"></div>
  `;
  app.appendChild(view);

  view.querySelector("#backBtn").addEventListener("click", () => goTypes(state.platform));
  renderTitleList(items);
}

function renderTitleList(items) {
  const area = document.getElementById("titleArea");
  if (!area) return;
  const query = state.search.trim().toLowerCase();
  const filtered = query
    ? items.filter(i => i.title.toLowerCase().includes(query))
    : items.slice();

  filtered.sort((a, b) => a.title.localeCompare(b.title));

  if (filtered.length === 0) {
    area.innerHTML = `<div class="empty-state"><p>Nenhum título encontrado.</p></div>`;
    return;
  }

  const groups = {};
  filtered.forEach(item => {
    const letter = item.title.charAt(0).toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(item);
  });

  const letters = Object.keys(groups).sort();
  area.innerHTML = letters.map(letter => `
    <section class="letter-group">
      <h2 class="letter-heading">${letter}</h2>
      <div class="titles">
        ${groups[letter].map((item, idx) => `
          <button class="title-item" data-idx="${filtered.indexOf(item)}">
            ${escapeHtml(item.title)}
          </button>
        `).join("")}
      </div>
    </section>
  `).join("");

  area.querySelectorAll(".title-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = filtered[parseInt(btn.dataset.idx, 10)];
      handleTitleClick(item);
    });
  });
}

/* =========================================================
   LÓGICA DE CLIQUE E FONTES (CORRIGIDO)
   ========================================================= */
function handleTitleClick(item) {
  // Se o item tiver o objeto "links" com mais de uma opção
  if (item.links) {
    const sources = [];
    if (item.links.drive) sources.push({ kind: "drive", url: item.links.drive });
    if (item.links.telegram) sources.push({ kind: "telegram", url: item.links.telegram });
    
    if (sources.length > 1) {
      openSourceModal(item, sources);
    } else if (sources.length === 1) {
      window.open(sources[0].url, "_blank");
    }
  } 
  // Se tiver apenas o "link" direto (estilo antigo)
  else if (item.link) {
    window.open(item.link, "_blank");
  }
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
function goHome() { state.view = "platforms"; state.platform = null; state.type = null; render(); }
function goTypes(key) { state.view = "types"; state.platform = key; state.type = null; render(); }
function goTitles(key, type) { state.view = "titles"; state.platform = key; state.type = type; render(); }

/* =========================================================
   MODAIS
   ========================================================= */
const sourceModal = document.getElementById("sourceModal");
const sourceTitleEl = document.getElementById("sourceTitle");
const sourceDriveBtn = document.getElementById("sourceDrive");
const sourceTelegramBtn = document.getElementById("sourceTelegram");
const sourceCancelBtn = document.getElementById("sourceCancel");

let activeSources = { drive: null, telegram: null };

function openSourceModal(item, sources) {
  activeSources = { drive: null, telegram: null };
  sources.forEach(s => { activeSources[s.kind] = s.url; });
  sourceTitleEl.textContent = item.title;
  sourceDriveBtn.style.display = activeSources.drive ? "" : "none";
  sourceTelegramBtn.style.display = activeSources.telegram ? "" : "none";
  sourceModal.classList.add("open");
  document.body.classList.add("modal-open");
}

function closeSourceModal() {
  sourceModal.classList.remove("open");
  document.body.classList.remove("modal-open");
}

sourceDriveBtn.addEventListener("click", () => {
  if (activeSources.drive) window.open(activeSources.drive, "_blank");
  closeSourceModal();
});

sourceTelegramBtn.addEventListener("click", () => {
  if (activeSources.telegram) window.open(activeSources.telegram, "_blank");
  closeSourceModal();
});

sourceCancelBtn.addEventListener("click", closeSourceModal);

/* =========================================================
   OUTROS
   ========================================================= */
searchInput.addEventListener("input", (e) => {
  state.search = e.target.value;
  if (state.view === "titles") {
    const items = DATA[state.platform][state.type] || [];
    renderTitleList(items);
  }
});

logo.addEventListener("click", goHome);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

render();
</script>
